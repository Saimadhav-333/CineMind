server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: content-service
          uri: http://localhost:8081
          predicates:
            - Path=/content/**
          filters:
            - StripPrefix=1

        - id: watch-history-service
          uri: http://localhost:8082
          predicates:
            - Path=/watch/**
        - id: recommendation-service
          uri: http://localhost:8083
          predicates:
            - Path=/recommendations/**



